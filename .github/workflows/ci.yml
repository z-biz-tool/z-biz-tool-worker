name: CI

# 原先只有 build.yml（`push: tags: v*` + 四平台 tauri build），推 main 完全不设门禁：
# 想确认一次"typecheck / 测试过不过"就得打个 tag，付四份打包的开销。
# 这里把廉价门禁拆出来每次 push / PR 跑；出包仍然只认 tag。
#
# 后端只排 ubuntu-22.04：本仓 src-tauri 里没有 cfg(windows)/cfg(unix) 分支，
# macOS 那条腿与本地开发环境重复，加上去只是多烧 runner。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 同分支后一次推送取消前一次：多会话并行直推 main 时，不取消会次次占满 runner。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0

jobs:
  frontend:
    name: 前端 typecheck + 构建
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmmirror.com

      - name: Typecheck
        run: npm run typecheck

      # dist 在 .gitignore 里，而 tauri::generate_context! 要读 frontendDist，
      # 所以任何 cargo 步骤之前必须先出一次前端。
      - name: Build frontend
        run: npm run build

  backend:
    name: Rust test + clippy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # runner 上新版 token 会写坏 rust-toolchain 生成的 cargo config（与 build.yml 同一条 workaround）
      - name: Reset broken cargo config
        run: rm -f "$HOME/.cargo/config.toml"

      - name: Build frontend (for Tauri context)
        run: |
          npm ci --registry=https://registry.npmmirror.com
          npm run build

      - name: Tests
        working-directory: src-tauri
        run: cargo test

      - name: Clippy (advisory)
        # 先不加 `-D warnings`：这条门禁从没在本仓跑过，Linux 上的告警集本地量不到；
        # 一上来就升级成失败只会得到一条没人能从本地开始查的红灯。跑出干净结果后再收严。
        working-directory: src-tauri
        run: cargo clippy --all-targets
